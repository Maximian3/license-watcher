name: License Monitor

on:
  schedule:
    - cron: '0 9 * * 1'  # каждый понедельник в 9:00 UTC
  workflow_dispatch:      # запуск вручную

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore license cache
        uses: actions/cache@v4
        with:
          path: license-hashes.json
          key: license-hashes-${{ github.run_id }}
          restore-keys: license-hashes-

      - name: Check licenses
        id: check
        run: |
          python3 << 'EOF'
          import urllib.request
          import hashlib
          import json
          import os

          REPOS = [
            "tensorflow/tensorflow",
            "pytorch/pytorch",
            "huggingface/transformers",
            "langchain-ai/langchain",
            "ollama/ollama",
            "ggerganov/llama.cpp",
            "AUTOMATIC1111/stable-diffusion-webui",
            "openai/whisper",
            "huggingface/diffusers",
            "microsoft/DeepSpeed",
            "ray-project/ray",
            "mlflow/mlflow",
            "apache/airflow",
            "open-mmlab/mmdetection",
            "facebookresearch/faiss",
            "openai/gym",
            "lucidrains/denoising-diffusion-pytorch",
            "invoke-ai/InvokeAI",
            "mudler/LocalAI",
            "n8n-io/n8n",
          ]

          LICENSE_FILES = ["LICENSE", "LICENSE.md", "LICENSE.txt", "COPYING"]

          def fetch_license(repo):
              for fname in LICENSE_FILES:
                  url = f"https://raw.githubusercontent.com/{repo}/main/{fname}"
                  try:
                      with urllib.request.urlopen(url, timeout=10) as r:
                          return hashlib.sha256(r.read()).hexdigest()
                  except:
                      pass
              return None

          cache_file = "license-hashes.json"
          old = json.load(open(cache_file)) if os.path.exists(cache_file) else {}
          new = {}
          changed = []

          for repo in REPOS:
              h = fetch_license(repo)
              new[repo] = h
              if repo in old and old[repo] and h and old[repo] != h:
                  changed.append(repo)
              print(f"{'CHANGED' if repo in changed else 'ok':8} {repo}")

          json.dump(new, open(cache_file, "w"), indent=2)

          if changed:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"changed=true\n")
                  f.write(f"repos={'|'.join(changed)}\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("changed=false\n")
          EOF

      - name: Save updated cache
        uses: actions/cache/save@v4
        with:
          path: license-hashes.json
          key: license-hashes-${{ github.run_id }}

      - name: Send email notification
        if: steps.check.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: License Monitor
          subject: "⚠️ License changed: ${{ steps.check.outputs.repos }}"
          body: |
            Обнаружено изменение лицензии в следующих репозиториях:

            ${{ steps.check.outputs.repos }}

            Проверь вручную:
            ${{ steps.check.outputs.repos }}
