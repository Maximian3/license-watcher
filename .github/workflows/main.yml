name: License Monitor

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 UTC
  workflow_dispatch:      # Manual trigger (sends a test email)

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore license cache
        uses: actions/cache@v4
        with:
          path: license-hashes.json
          key: license-hashes-${{ github.run_id }}
          restore-keys: license-hashes-

      - name: Check licenses
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import subprocess
          import hashlib
          import json
          import os

          REPOS = [
            "tensorflow/tensorflow",
            "pytorch/pytorch",
            "huggingface/transformers",
            "langchain-ai/langchain",
            "ollama/ollama",
            "ggerganov/llama.cpp",
            "AUTOMATIC1111/stable-diffusion-webui",
            "openai/whisper",
            "huggingface/diffusers",
            "microsoft/DeepSpeed",
            "ray-project/ray",
            "mlflow/mlflow",
            "apache/airflow",
            "open-mmlab/mmdetection",
            "facebookresearch/faiss",
            "openai/gym",
            "lucidrains/denoising-diffusion-pytorch",
            "invoke-ai/InvokeAI",
            "mudler/LocalAI",
            "n8n-io/n8n",
          ]

          def fetch_license(repo):
              cmd = [
                  "gh", "api",
                  "-H", "Accept: application/vnd.github.raw+json",
                  f"/repos/{repo}/license"
              ]
              res = subprocess.run(cmd, capture_output=True)
              if res.returncode == 0 and res.stdout:
                  return hashlib.sha256(res.stdout).hexdigest(), None
              err = res.stderr.decode("utf-8", errors="ignore").strip().splitlines()
              return None, (err[-1] if err else "Unknown error")

          cache_file = "license-hashes.json"
          old = json.load(open(cache_file)) if os.path.exists(cache_file) else {}
          new = {}
          changed = []
          not_found = []

          for repo in REPOS:
              h, err = fetch_license(repo)
              if h is None:
                  not_found.append(f"{repo} ({err})")
                  new[repo] = old.get(repo)
                  print(f"{'MISSING':8} {repo} -> {err}")
                  continue

              new[repo] = h
              if repo in old and old[repo] and old[repo] != h:
                  changed.append(repo)
              print(f"{'CHANGED' if repo in changed else 'ok':8} {repo}")

          with open(cache_file, "w") as f:
              json.dump(new, f, indent=2)

          if changed:
              subject = f"⚠️ License changed: {', '.join(changed)}"
              links = "\n".join("- https://" + "://github.com" + r for r in changed)
              body = f"License changes detected in the following repositories:\n\n{links}"
          else:
              subject = "✅ License Monitor: Test run (no changes)"
              body = f"Check completed successfully. No license changes detected.\nTotal repositories checked: {len(REPOS)}."
              if not_found:
                  body += "\n\nCould not find license file for:\n" + "\n".join(f"- {item}" for item in not_found)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
              f.write(f"subject={subject}\n")
              f.write("body<<EOF\n")
              f.write(f"{body}\n")
              f.write("EOF\n")
          EOF

      - name: Save updated cache
        uses: actions/cache/save@v4
        with:
          path: license-hashes.json
          key: license-hashes-${{ github.run_id }}

      - name: Send email notification
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: License Monitor
          subject: ${{ steps.check.outputs.subject }}
          body: ${{ steps.check.outputs.body }}
